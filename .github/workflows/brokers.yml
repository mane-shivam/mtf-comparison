name: Quick sync (accounts and prices)

# The Refresh button and Sign in with Rupeezy start this: a read-only sync of your Kotak and Rupeezy
# accounts plus prices for pinned stocks (under a minute). The MTF lists, events and exchange data
# refresh in refresh.yml every hour.
on:
  workflow_dispatch:

permissions:
  contents: write

# Its own group: a quick sync never waits behind the hourly refresh (up to 8 min on the Kotak list) and
# never displaces a waiting hourly run (GitHub keeps one waiting run per group). Two quick syncs still
# queue one after the other.
concurrency:
  group: quick-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prices for pinned stocks
        continue-on-error: true
        run: python scrapers/market.py --prices-only
      - name: Broker accounts (read-only)
        continue-on-error: true
        run: python scripts/brokers.py
        env:
          POSITIONS_PASSPHRASE: ${{ secrets.POSITIONS_PASSPHRASE }}
          KOTAK_ACCESS_TOKEN: ${{ secrets.KOTAK_ACCESS_TOKEN }}
          KOTAK_TOTP_SECRET: ${{ secrets.KOTAK_TOTP_SECRET }}
          KOTAK_MOBILE: ${{ secrets.KOTAK_MOBILE }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          RUPEEZY_API_KEY: ${{ secrets.RUPEEZY_API_KEY }}
          RUPEEZY_APP_ID: ${{ secrets.RUPEEZY_APP_ID }}
      - name: Commit if changed
        if: always()
        run: |
          git add data/broker.enc.json data/rupeezy_session.enc.json public/data/market.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git config user.name "mtf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: broker sync $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash -X ours && sleep $((i * 5))  # a refresh that saved first wins: its data is as fresh
          done
          exit 1
