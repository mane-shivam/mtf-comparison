name: Refresh MTF data

on:
  schedule:
    - cron: "30 4 * * *"   # 10:00 IST
    - cron: "45 10 * * *"  # 16:15 IST, after close
    - cron: "30 14 * * *"  # 20:00 IST
  workflow_dispatch:       # Refresh button (/api/refresh) or GitHub's "Run workflow"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q

      # Each scraper keeps the previous good file on failure, so one broken
      # site never blanks its column; merge.py marks it stale instead.
      - name: NSE master lists
        run: python scrapers/nse.py
        continue-on-error: true
      - name: Kotak Neo
        run: python scrapers/kotak.py
        continue-on-error: true
      - name: Paytm Money
        run: python scrapers/paytm.py
        continue-on-error: true
      - name: Rupeezy
        run: python scrapers/rupeezy.py
        continue-on-error: true

      - name: Merge
        run: python merge.py

      - name: Commit if changed
        run: |
          git add data public/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "mtf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs && sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
