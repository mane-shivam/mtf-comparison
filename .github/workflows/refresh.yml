name: Refresh MTF data

on:
  schedule:
    # GitHub cron is UTC (IST - 5:30) and often starts a few minutes late.
    - cron: "30 2-12 * * *"     # every hour 08:00-18:00 IST
    - cron: "30 16,20,0 * * *"  # every 4 hours overnight: 22:00, 02:00, 06:00 IST
  workflow_dispatch:       # Refresh button (/api/refresh) or GitHub's "Run workflow"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parser tests
        run: python -m pytest -q

      # Each scraper keeps the previous good file on failure, so one broken
      # site never blanks its column; merge.py marks it stale instead.
      - name: NSE master lists
        run: python scrapers/nse.py
        continue-on-error: true
      - name: Kotak Neo
        run: python scrapers/kotak.py
        continue-on-error: true
      - name: Rupeezy
        run: python scrapers/rupeezy.py
        continue-on-error: true

      - name: NSE / BSE surveillance (ASM, GSM)
        run: python scrapers/surveillance.py
        continue-on-error: true

      - name: NSE F&O ban list and company events
        run: python scrapers/events.py
        continue-on-error: true

      - name: Prices, exchange margin, F&O OI, delivery, deals, pledges
        run: python scrapers/market.py
        continue-on-error: true

      - name: Merge
        run: python merge.py

      # Read-only pull of holdings, positions, trades and funds from the brokers' APIs, saved encrypted
      # (data/broker.enc.json). Skipped for a broker whose secrets aren't set.
      - name: Broker accounts (read-only)
        continue-on-error: true
        run: python scripts/brokers.py
        env:
          POSITIONS_PASSPHRASE: ${{ secrets.POSITIONS_PASSPHRASE }}
          KOTAK_ACCESS_TOKEN: ${{ secrets.KOTAK_ACCESS_TOKEN }}
          KOTAK_TOTP_SECRET: ${{ secrets.KOTAK_TOTP_SECRET }}
          KOTAK_MOBILE: ${{ secrets.KOTAK_MOBILE }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          RUPEEZY_API_KEY: ${{ secrets.RUPEEZY_API_KEY }}
          RUPEEZY_APP_ID: ${{ secrets.RUPEEZY_APP_ID }}
          RUPEEZY_CLIENT_CODE: ${{ secrets.RUPEEZY_CLIENT_CODE }}
          RUPEEZY_PASSWORD: ${{ secrets.RUPEEZY_PASSWORD }}
          RUPEEZY_TOTP_SECRET: ${{ secrets.RUPEEZY_TOTP_SECRET }}

      # Decrypts the synced positions for top-up warnings and builds the 08:00 IST summary.
      # Only hashes and the summary date are committed; the readable output is gitignored.
      - name: Portfolio checks and morning summary
        continue-on-error: true
        run: python scripts/portfolio.py
        env:
          POSITIONS_PASSPHRASE: ${{ secrets.POSITIONS_PASSPHRASE }}

      - name: Commit if changed
        run: |
          git add data public/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "mtf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs && sleep $((i * 5))
          done
          exit 1

      # Push this run's watchlist changes, top-up warnings and the morning summary to the phone (Telegram and/or ntfy, if their secrets are set).
      - name: Notify
        continue-on-error: true
        run: python scripts/notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

  deploy:
    needs: refresh
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
